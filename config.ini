# Sinine Kapp Configuration
# 
# This file allows you to quickly switch between laptop development mode
# and hardware mode without editing code.

[Hardware]
# Set to False for laptop development, True for Raspberry Pi hardware
mock_mode = False

# Door open duration in seconds (for simulation)
door_duration = 15

[Display]
# Screen resolution (width x height)
# Vertical kiosk: 1080 x 1920
# For laptop testing, try: 540 x 960 (half size)
screen_width = 1080
screen_height = 1920

# Fullscreen mode (True/False)
# Set to False for windowed mode on laptop
fullscreen = False

[Database]
# Database file path
database_file = database.db

[Logging]
# Log file path
log_file = main.log

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
